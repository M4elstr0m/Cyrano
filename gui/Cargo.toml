[package]
name = "cyrano-gui"
version = "0.1.0"
authors = ["M4elstr0m <112475171+M4elstr0m@users.noreply.github.com>"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
cyrano-core = { version = "0.1.0", path = "../core" }
dioxus = { version = "0.7.1", features = ["native"] }
dioxus-native = { path = "vendor/dioxus-native" }
directories = "6.0.0"
hayro = "0.8.0"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
opener = { version = "0.9.0", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
toml = "1.1.6"
winit = "0.30.13"

[features]
default = ["native"]
native = ["dioxus/native"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
