[package]
name = "cyrano-gui"
version = "0.1.0"
authors = ["M4elstr0m <112475171+M4elstr0m@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cyrano-core = { version = "0.1.0", path = "../core" }
dioxus = { version = "0.7.1", features = ["native"] }

[features]
default = ["native"]
native = ["dioxus/native"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
